services:
  # ==========================================
  # ROOMLY API
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: roomly-api:local
    container_name: roomly-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - roomly-network

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: roomly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - roomly-network

  # ==========================================
  # REDIS
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: roomly-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - roomly-network

# ==========================================
# PERSISTENT VOLUMES
# ==========================================
volumes:
  postgres_data:
    external: true
    name: roomly-postgres-data

  redis_data:
    external: true
    name: roomly-redis-data

# ==========================================
# DOCKER NETWORK
# ==========================================
networks:
  roomly-network:
    external: true
    name: roomly-network